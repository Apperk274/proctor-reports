<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proctor Simulator — Reports</title>
<meta name="description" content="Visual review reports for the development of Exam Supervisor Simulator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #eef2f3;
  --surface: #ffffff;
  --ink: #152024;
  --muted: #56666c;
  --line: #d3dcdf;
  --accent: #0f766e;
  --accent-soft: #d6efec;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1416; --surface: #162023; --ink: #e4ecee; --muted: #94a5ab; --line: #28353a;
    --accent: #3fb8ae; --accent-soft: #163b38; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1416; --surface: #162023; --ink: #e4ecee; --muted: #94a5ab; --line: #28353a;
  --accent: #3fb8ae; --accent-soft: #163b38; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 56px; margin: 0;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 40px; }
h1, h2 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; max-width: 68ch; }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
header { padding-block: 40px 0; display: grid; gap: 16px; }
.lede { color: var(--muted); font-size: 1.1rem; }

.categories { display: grid; gap: 36px; }
.category { display: grid; gap: 12px; }
.category > h2 { font-size: 0.8rem; font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.category > h2 .count { color: var(--accent); font-variant-numeric: tabular-nums; }
.reports { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.report { min-width: 0; }
.report a {
  display: grid; gap: 6px; padding: 16px 18px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  transition: border-color 120ms ease;
}
.report a:hover, .report a:focus-visible { border-color: var(--accent); }
.report a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.report h3 { font-family: var(--display); font-size: 1.25rem; font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; color: var(--accent); overflow-wrap: anywhere; }
.report p { color: var(--muted); font-size: 0.95rem; }
.report .updated { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; color: var(--muted); }
.notice a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .report a { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Exam Supervisor Simulator</span>
    <h1>Proctor Simulator — Reports</h1>
    <p class="lede">Visual review reports from the game's development.</p>
  </header>
  <main>
    <div class="categories" id="categories">
      <p class="notice">Loading the report list…</p>
    </div>
    <noscript><p class="notice">The report list needs JavaScript. The raw list is in <a href="reports.json">reports.json</a>.</p></noscript>
  </main>
</div>
<script>
(() => {
  const host = document.getElementById("categories");
  const el = (tag, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  };
  const fail = () => {
    host.replaceChildren(el("p", { className: "notice" },
      "The report list could not be loaded. Try reloading, or open ",
      el("a", { href: "reports.json", textContent: "reports.json" }), " directly."));
  };
  fetch("reports.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(({ categories, reports }) => {
      const sections = categories.map((cat) => {
        const items = reports
          .filter((r) => r.category === cat.id)
          .sort((a, b) => b.updated.localeCompare(a.updated));
        if (!items.length) return null;
        const section = el("section", { className: "category", id: cat.id },
          el("h2", { id: `cat-${cat.id}` }, cat.title,
            el("span", { className: "count", textContent: String(items.length) })),
          el("ul", { className: "reports" }, ...items.map((r) => el("li", { className: "report" },
            el("a", { href: `${r.slug}/` },
              el("span", { className: "updated" }, "Updated ",
                el("time", { dateTime: r.updated, textContent: r.updated })),
              el("h3", { textContent: r.title }),
              el("p", { textContent: r.summary }))))));
        section.setAttribute("aria-labelledby", `cat-${cat.id}`);
        return section;
      }).filter(Boolean);
      if (!sections.length) throw new Error("empty");
      host.replaceChildren(...sections);
    })
    .catch(fail);
})();
</script>
</body>
</html>
